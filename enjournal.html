<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AOI — Journal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&family=Noto+Serif+JP:wght@200;300;400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="journalstyle.css" />
</head>

<body>

  <nav id="nav">

    <a href="index.html" class="nav-logo">
      蒼 — AOI
    </a>

    <ul class="nav-center">
      <li><a href="/journal-en.html">Journal</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <div class="nav-right">
      <a href="/journal.html" class="lang-btn">JP</a>
    </div>

  </nav>

  <main class="journal-layout">

    <section class="journal-wrap">

      <div class="section-header">

        <div>

          <p class="section-tag">
            JOURNAL ARCHIVE
          </p>

          <h2 class="section-title">
            Visual memories and<br>
            atmospheric writing.
          </h2>

        </div>

      </div>

      <div class="journal-grid" id="journal-grid"></div>

    </section>

  </main>

  <footer>

    <div class="footer-logo">
      蒼 — AOI
    </div>

    <p class="footer-copy">
      VISUAL JOURNAL ARCHIVE
    </p>

  </footer>

  <script>
    const nav = document.getElementById('nav');

    window.addEventListener('scroll', () => {

      if (window.scrollY > 60) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }

    });
  </script>

  <script type="module" src="journal.js"></script>

</body>
</html>
