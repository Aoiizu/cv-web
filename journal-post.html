<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src *;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AOI — Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="journalstyle.css" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    .post-hero { width: 100%; height: 280px; overflow: hidden; }
    .post-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .post-body { max-width: 720px; margin: 0 auto; padding: 64px 40px 120px; }
    .back-link {
      display: inline-block; margin-bottom: 48px;
      font-size: 11px; letter-spacing: 0.22em;
      color: var(--ink); text-decoration: none;
      opacity: 0.45; border-bottom: 1px solid currentColor;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }
    .post-meta { display: flex; gap: 16px; margin-bottom: 20px; }
    .post-title {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 200; line-height: 1.4;
      letter-spacing: 0.03em; margin-bottom: 40px;
    }
    .post-content {
      font-size: 15px; line-height: 2.2;
      color: var(--warm-mid); letter-spacing: 0.03em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <nav id="nav">
    <a href="/en.html" class="nav-logo">蒼 — AOI</a>
    <ul class="nav-center">
      <li><a href="/enjournal.html">Journal</a></li>
      <li><a href="/en.html#about">About</a></li>
    </ul>
    <div class="nav-right">
      <a href="/journal.html" class="lang-btn">JP</a>
    </div>
  </nav>

  <div class="post-hero"><img id="post-img" src="" alt="" /></div>

  <div class="post-body">
    <a href="/enjournal.html" class="back-link">← Back to Journal</a>
    <div class="post-meta">
      <span class="card-date" id="post-date"></span>
      <span class="card-tag" id="post-location"></span>
    </div>
    <h1 class="post-title" id="post-title"></h1>
    <p class="post-content" id="post-content"></p>
  </div>

  <footer>
    <div class="footer-logo">蒼 — AOI</div>
    <p class="footer-copy">© Aoi 2026</p>
  </footer>

  <script>
    const nav = document.getElementById('nav')
    window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 60))
  </script>
  <script type="module" src="journal-post.js"></script>
</body>
</html>
