<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>蒼 — AOI Journal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&family=Noto+Serif+JP:wght@200;300;400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="journalstyle.css" />
</head>

<body>

  <nav id="nav">

    <a href="index.html" class="nav-logo">
      蒼 — AOI
    </a>

    <ul class="nav-center">
      <li><a href="/journal.html">記録</a></li>
      <li><a href="#about">について</a></li>
      <li><a href="#contact">連絡</a></li>
    </ul>

    <div class="nav-right">
      <a href="/en.html" class="lang-btn">EN</a>
    </div>

  </nav>

  <main class="journal-layout">

    <section class="journal-wrap">

      <div class="section-header">

        <div>

            <section class="upload-panel">

            <input type="text" id="title" placeholder="Title">

            <textarea id="description" placeholder="Description"></textarea>

            <textarea id="content" placeholder="Journal content"></textarea>

            <input type="text" id="image" placeholder="Image URL">

            <button id="upload-btn">
                Publish Journal
            </button>

            </section>

          <p class="section-tag">
            記録保管庫
          </p>

          <h2 class="section-title">
            視覚的な記憶と、<br>
            雰囲気を残す文章。
          </h2>

        </div>

      </div>

      <div class="journal-grid" id="journal-grid"></div>

    </section>

  </main>

  <footer>

    <div class="footer-logo">
      蒼 — AOI
    </div>

    <p class="footer-copy">
      VISUAL JOURNAL ARCHIVE
    </p>

  </footer>

  <script>
    const nav = document.getElementById('nav');

    window.addEventListener('scroll', () => {

      if (window.scrollY > 60) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }

    });
  </script>

  <script type="module" src="journal.js"></script>

</body>
</html>
